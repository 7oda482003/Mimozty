<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>لماذا أحب مريم؟</title>

    <!-- الخط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- ملف التصميم -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="why-love.css">
</head>

<body>
    
    <div class="background">
        <span class="blob blob1"></span>
        <span class="blob blob2"></span>
        <span class="blob blob3"></span>

        <span class="heart heart1">🤍</span>
        <span class="heart heart2">❤</span>
        <span class="heart heart3">🤍</span>
    </div>


    <main class="page">

        <section class="hero hidden">

            <h1>لماذا أحب مريم؟</h1>

            <p>
                لأن بعض الاشخاص لا يمكن اختصارهم في كلة
            </p>
            <p>
                فكان يجب عمل صفحة لوصفهم
            </p>

                        
            <div class="progress-container hidden">

                <div class="progress-header">

                    <span> رحلتك لاكتشاف الأسباب🤍</span>

                    <span id="progressText"></span>

                </div>

                <div class="progress-bar">

                    <div class="progress-fill" id="progressFill"></div>

                </div>

            </div>

        </section>

        <section class="cards-container">

        </section>


    </main>

    <div id="toast"></div>
    <!-- Final Letter -->
    <div id="finalMessage" class="final-message">

        <div class="secret-box">

            <button class="close-btn" id="closeFinal">
                ✕
            </button>

            <div class="secret-content">

                <h1 class="letter-title">
                    🤍 رسالة إليكِ
                </h1>

                <div id="letterContent">

                    <section class="letter-section">

                        <h2>لو سألوني...</h2>

                        <p>
                            لماذا أحب مريم؟
                        </p>

                    </section>

                    <section class="letter-section">

                        <p>
                            لقلت...
                            لأن بعض الأشخاص لا يمكن وصفهم بكلمات،
                            وإنما يُحكى عنهم العمر كله.
                        </p>

                    </section>

                    <section class="letter-section">

                        <img src="" class="letter-image">

                    </section>

                    <section class="letter-section">

                        <p>

                            هنا هتكتب أول جزء من الرسالة...

                        </p>

                    </section>

                </div>

            </div>

        </div>

    </div>

    <script src="why-love.js"></script>

</body>

</html>
